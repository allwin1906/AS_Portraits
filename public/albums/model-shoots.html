<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Model & Editorial Portfolios | AS Portraits</title>
  <meta name="description" content="High-end editorial and cinematic portfolios for models and brands. Photography by AS Portraits." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --gold: #c9a96e; --gold-2: #e0c48a;
      --black: #080808; --dark: #0f0f0f; --charcoal: #141414;
      --beige: #f5f0e8;
      --serif: 'Playfair Display', Georgia, serif;
      --sans:  'Inter', system-ui, sans-serif;
    }
    html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
    body { background: var(--black); color: var(--beige); font-family: var(--sans); overflow-x: hidden; opacity: 1; transition: opacity 0.4s ease-in-out; }
    body.page-exit { opacity: 0 !important; }
    a { text-decoration: none; color: inherit; }
    img { display: block; width: 100%; height: 100%; object-fit: cover; }

    /* NAV */
    .album-nav {
      position: fixed; top: 0; left: 0; width: 100%; z-index: 500;
      padding: 1.2rem clamp(1.5rem, 5vw, 4rem);
      display: flex; align-items: center; justify-content: space-between;
      transition: background 0.5s, border-color 0.5s;
    }
    .album-nav.scrolled { background: rgba(8,8,8,0.9); backdrop-filter: blur(20px); }
    .back-link { display: flex; align-items: center; gap: 0.6rem; font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(245,240,232,0.6); transition: color 0.3s; }
    .back-link svg { transition: transform 0.3s ease; }
    .back-link:hover { color: var(--gold); }
    .back-link:hover svg { transform: translateX(-4px); }
    .nav-brand { font-family: var(--sans); font-size: 0.85rem; font-weight: 700; letter-spacing: 0.25em; color: var(--gold); }

    /* HERO */
    .hero {
      position: relative; height: 100svh; display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .hero-img {
      position: absolute; inset: 0;
      background-image: url('https://res.cloudinary.com/duvkbm8jv/image/upload/q_auto/f_auto/v1777309303/ASP06320_dfomwj.jpg');
      background-size: cover; background-position: center;
      filter: brightness(0.5);
      transform: scale(1.1); transition: transform 10s ease;
    }
    .hero-img.loaded { transform: scale(1); }
    .hero-content { position: relative; z-index: 2; text-align: center; max-width: 900px; padding: 0 2rem; }
    .hero-tag { font-size: 0.75rem; letter-spacing: 0.4em; text-transform: uppercase; color: var(--gold); margin-bottom: 2rem; }
    .hero-title { font-family: var(--serif); font-size: clamp(4rem, 15vw, 11rem); font-style: italic; line-height: 0.8; color: #fff; margin-bottom: 2rem; }

    /* GALLERY GRID */
    .gallery-section { padding: clamp(4rem, 8vw, 8rem) clamp(1.5rem, 5vw, 4rem); max-width: 1400px; margin: 0 auto; }
    .section-label { font-size: 0.68rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--gold); margin-bottom: 3rem; display: flex; align-items: center; gap: 0.8rem; }
    .section-label::after { content: ''; flex: 1; height: 1px; background: rgba(201,169,110,0.15); }

    .mosaic-layout { display: grid; grid-template-columns: repeat(6, 1fr); gap: 1.2rem; }
    .photo-wrap {
      position: relative; overflow: hidden; border-radius: 4px; background: var(--charcoal); cursor: zoom-in;
      opacity: 0; transform: translateY(20px); transition: all 0.8s ease;
    }
    .photo-wrap.visible { opacity: 1; transform: translateY(0); }
    .photo-wrap img { transition: transform 0.8s ease; filter: brightness(0.9); }
    .photo-wrap:hover img { transform: scale(1.05); filter: brightness(1); }

    .span-3 { grid-column: span 3; aspect-ratio: 3/4; }
    .span-2 { grid-column: span 2; aspect-ratio: 3/4; }
    .span-6 { grid-column: span 6; aspect-ratio: 16/7; }

    /* CTA */
    .cta-editorial { padding: 10vw 2rem; text-align: center; }
    .cta-editorial h2 { font-family: var(--serif); font-size: clamp(3rem, 10vw, 7rem); font-style: italic; color: #fff; line-height: 1; margin-bottom: 3rem; }
    .btn-editorial { display: inline-flex; align-items: center; gap: 1rem; color: #fff; font-size: 1.2rem; border-bottom: 1px solid var(--gold); padding: 0.5rem 0; transition: 0.3s; }
    .btn-editorial:hover { color: var(--gold); padding-right: 1.5rem; }

    footer { text-align: center; padding: 5rem 2rem; font-size: 0.75rem; color: rgba(245,240,232,0.2); }

    /* LIGHTBOX */
    .lightbox { display: none; position: fixed; inset: 0; z-index: 900; background: rgba(5,5,5,0.98); backdrop-filter: blur(15px); align-items: center; justify-content: center; }
    .lightbox.open { display: flex; }
    .lb-img { max-width: 90vw; max-height: 85vh; object-fit: contain; border-radius: 2px; }
    .lb-close { position: fixed; top: 2rem; right: 2rem; background: none; border: none; color: #fff; font-size: 2rem; cursor: pointer; opacity: 0.5; transition: 0.3s; z-index: 901; }
    .lb-close:hover { opacity: 1; }

    @media (max-width: 768px) {
      .mosaic-layout { grid-template-columns: repeat(2, 1fr); gap: 0.8rem; }
      .span-3, .span-2, .span-6 { grid-column: span 2; aspect-ratio: 3/4; }
      .span-6 { aspect-ratio: 16/9; }
    }
  </style>
</head>
<body>

  <div class="lightbox" id="lightbox">
    <button class="lb-close" id="lb-close">✕</button>
    <img src="" alt="" class="lb-img" id="lb-img" />
  </div>

  <script>
    const nav = document.getElementById('album-nav')
    window.addEventListener('scroll', () => {
      if (scrollY > window.innerHeight * 0.5) nav.classList.add('scrolled')
      else nav.classList.remove('scrolled')
    })
    setTimeout(() => document.getElementById('hero-img').classList.add('loaded'), 100)

    const photos = document.querySelectorAll('.photo-wrap')
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => { if(e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target) } })
    }, { threshold: 0.1 })
    photos.forEach(p => io.observe(p))

    const lb = document.getElementById('lightbox'), lbImg = document.getElementById('lb-img')
    photos.forEach(item => {
      item.onclick = () => {
        lbImg.src = item.querySelector('img').src
        lb.classList.add('open')
        document.body.style.overflow = 'hidden'
      }
    })
    document.getElementById('lb-close').onclick = () => {
      lb.classList.remove('open')
      document.body.style.overflow = ''
    }
    lb.onclick = (e) => { if(e.target === lb) document.getElementById('lb-close').click() }

    // Page Transitions
    document.addEventListener('click', e => {
      const link = e.target.closest('a');
      if (!link) return;
      const href = link.getAttribute('href');
      const target = link.getAttribute('target');
      if (href && !href.startsWith('http') && !href.startsWith('mailto') && !href.startsWith('tel') && !href.startsWith('#') && target !== '_blank') {
        e.preventDefault();
        document.body.classList.add('page-exit');
        setTimeout(() => { window.location.href = href; }, 400);
      }
    });
  </script>
